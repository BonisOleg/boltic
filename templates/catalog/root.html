{% extends "base.html" %}
{% block title %}Каталог — {{ site_settings.site_name }}{% endblock %}
{% block content %}
<div class="container">
  <div class="section-card">
    <div class="section-head"><h1 style="margin:0;font-size:22px;text-transform:uppercase">Каталог</h1></div>
    <div class="section-body">
      <div class="l1-grid">
        {% for c in categories %}
        <a class="l1-card" href="{% url 'catalog:category' path=c.url_path %}">{{ c.name }}</a>
        {% empty %}<p class="empty-state">Немає категорій.</p>{% endfor %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
