{% extends "base.html" %}
{% block title %}Профіль — {{ site_settings.site_name }}{% endblock %}
{% block content %}
<div class="container">
  <div class="section-card section-card--md">
    <div class="section-head"><h1>Профіль</h1></div>
    <div class="section-body">
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="field">
          {{ field.label_tag }}{{ field }}
          {% if field.errors %}<div class="field-error">{{ field.errors }}</div>{% endif %}
        </div>
        {% endfor %}
        <button class="btn" type="submit">Зберегти</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
