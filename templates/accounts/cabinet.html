{% extends "base.html" %}
{% block title %}Кабінет — {{ site_settings.site_name }}{% endblock %}
{% block content %}
<div class="container">
  <div class="section-card section-card--lg">
    <div class="section-head"><h1>Кабінет</h1></div>
    <div class="section-body">
      <p>Вітаємо, {{ user.username }}!</p>
      <ul class="stack-list">
        <li><a class="btn" href="{% url 'accounts:orders' %}">Мої замовлення</a></li>
        <li><a class="btn btn--ghost" href="{% url 'accounts:profile' %}">Профіль</a></li>
        <li><a class="btn btn--ghost" href="{% url 'cart:wishlist' %}">Бажане</a></li>
        <li><a class="btn btn--ghost" href="{% url 'accounts:logout' %}">Вихід</a></li>
      </ul>
    </div>
  </div>
</div>
{% endblock %}
