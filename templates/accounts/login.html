{% extends "base.html" %}
{% block title %}Вхід — {{ site_settings.site_name }}{% endblock %}
{% block content %}
<div class="container">
  <div class="section-card section-card--xs">
    <div class="section-head"><h1>Вхід</h1></div>
    <div class="section-body">
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
      <form method="post" data-qa="login-form">
        {% csrf_token %}
        {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
        <div class="field">
          <label for="id_username">Логін</label>
          <input class="form-control" type="text" name="username" id="id_username" required autocomplete="username">
        </div>
        <div class="field">
          <label for="id_password">Пароль</label>
          <input class="form-control" type="password" name="password" id="id_password" required autocomplete="current-password">
        </div>
        <button class="btn btn--block" type="submit">Увійти</button>
      </form>
      <p class="u-mt-16">Ще немає акаунту? <a href="{% url 'accounts:register' %}{% if next_url %}?next={{ next_url|urlencode }}{% endif %}">Зареєструватися</a></p>
    </div>
  </div>
</div>
{% endblock %}
