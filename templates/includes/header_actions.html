<a class="action-link" href="{% url 'cart:wishlist' %}" title="Бажане" aria-label="Бажане">
  <span class="action-link__icon" aria-hidden="true">
    {% include "includes/icon_heart.html" %}
  </span>
  <span class="action-badge" data-wishlist-count{% if not wishlist_count %} hidden{% endif %}>{{ wishlist_count|default:0 }}</span>
  <span class="action-link__label">Бажане</span>
</a>
<a class="action-link" href="{% url 'cart:detail' %}" title="Кошик" aria-label="Кошик">
  <span class="action-link__icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 5.5h1.6l1.7 10.2a1.6 1.6 0 0 0 1.6 1.3h8.9a1.6 1.6 0 0 0 1.55-1.2l1.55-6.5H7.1"/>
      <circle cx="9.2" cy="19.2" r="1.35"/>
      <circle cx="16.3" cy="19.2" r="1.35"/>
    </svg>
  </span>
  <span class="action-badge" data-cart-count{% if not cart_count %} hidden{% endif %}>{{ cart_count|default:0 }}</span>
  <span class="action-link__label">Кошик</span>
</a>
{% if user.is_authenticated %}
<a class="action-link" href="{% url 'accounts:cabinet' %}" title="Кабінет" aria-label="Кабінет">
  <span class="action-link__icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="3.25"/>
      <path d="M5.5 19.2c1.5-3.1 3.7-4.7 6.5-4.7s5 1.6 6.5 4.7"/>
    </svg>
  </span>
  <span class="action-link__label">Кабінет</span>
</a>
{% else %}
<a class="action-link" href="{% url 'accounts:login' %}" title="Вхід" aria-label="Вхід">
  <span class="action-link__icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="3.25"/>
      <path d="M5.5 19.2c1.5-3.1 3.7-4.7 6.5-4.7s5 1.6 6.5 4.7"/>
    </svg>
  </span>
  <span class="action-link__label">Вхід</span>
</a>
{% endif %}
