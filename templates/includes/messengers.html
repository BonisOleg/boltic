{% if site_settings.filled_messengers %}
<nav class="messengers{% if messengers_modifier %} messengers--{{ messengers_modifier }}{% endif %}" aria-label="Месенджери">
  <ul class="messengers__list">
    {% for m in site_settings.filled_messengers %}
    <li>
      <a
        class="messengers__link messengers__link--{{ m.code }}"
        href="{{ m.url }}"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="{{ m.label }}"
      >
        <span class="messengers__icon" aria-hidden="true">
          {% if m.code == "viber" %}
          <svg viewBox="0 0 24 24" width="22" height="22" focusable="false"><path fill="currentColor" d="M11.4 2C6.2 2.2 2.1 6.4 2 11.6c-.05 2.7.9 5.1 2.5 6.9v2.8c0 .4.5.7.9.5l2.9-1.3c1.1.4 2.3.6 3.5.6h.1c5.3-.1 9.5-4.5 9.4-9.8C21.2 5.7 16.7 1.8 11.4 2zm.2 15.6c-1.1 0-2.1-.2-3.1-.6l-.4-.2-2.3 1 0-2.1-.2-.3A6.9 6.9 0 0 1 4.5 11.7c.1-3.9 3.3-7 7.2-7.1 3.9-.1 7.1 3 7.2 6.9.1 4-3.2 7.1-7.3 7.1zm4.1-4.6c-.2-.1-1.3-.6-1.5-.7-.2-.1-.4-.1-.5.1-.2.2-.6.7-.7.8-.1.1-.3.2-.5.1-.2-.1-.9-.3-1.7-1.1-.6-.6-1.1-1.3-1.2-1.5-.1-.2 0-.4.1-.5l.4-.5c.1-.1.2-.3.3-.4.1-.1.1-.3 0-.4-.1-.1-.5-1.3-.7-1.7-.2-.5-.4-.4-.5-.4h-.4c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9s.8 2.2.9 2.3c.1.2 1.6 2.5 3.9 3.4.5.2 1 .4 1.3.5.6.2 1.1.1 1.5.1.5-.1 1.3-.5 1.5-1 .2-.5.2-.9.1-1 0-.1-.2-.1-.4-.2z"/></svg>
          {% elif m.code == "whatsapp" %}
          <svg viewBox="0 0 24 24" width="22" height="22" focusable="false"><path fill="currentColor" d="M12.04 2a9.9 9.9 0 0 0-8.5 14.9L2 22l5.3-1.4A9.9 9.9 0 1 0 12.04 2zm5.8 14.1c-.2.7-1.3 1.2-2.1 1.4-.5.1-1.2.2-3.5-.7-2.8-1.2-4.6-4.1-4.7-4.3-.2-.2-1.2-1.6-1.2-3.1 0-1.5.8-2.2 1.1-2.5.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5.2.6.8 2 .8 2.1.1.1.1.3 0 .4l-.4.5c-.1.1-.3.3-.1.5.1.3.6 1 1.3 1.6.9.8 1.6 1 1.8 1.1.2.1.4.1.5-.1l.7-.8c.1-.2.3-.2.5-.1.2.1 1.4.7 1.6.8.2.1.4.2.4.3.1.4-.1 1.1-.3 1.8z"/></svg>
          {% else %}
          <svg viewBox="0 0 24 24" width="22" height="22" focusable="false"><path fill="currentColor" d="M12 2C6.5 2 2 6.1 2 11.2c0 2.9 1.5 5.5 3.9 7.2v3.5l3.6-2c.8.2 1.6.3 2.5.3 5.5 0 10-4.1 10-9.2S17.5 2 12 2zm1 12.2-2.5-2.7-4.9 2.7L12.9 8l2.6 2.7L20.3 8 13 14.2z"/></svg>
          {% endif %}
        </span>
        <span class="messengers__label">{{ m.label }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
</nav>
{% endif %}
