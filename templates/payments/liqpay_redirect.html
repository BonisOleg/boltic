{% extends "base.html" %}
{% load static %}
{% block title %}Оплата — {{ site_settings.site_name }}{% endblock %}
{% block content %}
<div class="container">
  <div class="section-card section-card--sm section-card--center">
    <div class="section-body">
      <h1 class="section-title">Перехід до оплати</h1>
      <p>Замовлення {{ order.number }} · {{ order.total }} грн</p>
      <form id="liqpay" method="POST" action="{{ liqpay_checkout_url }}" accept-charset="utf-8" data-qa="liqpay-form">
        <input type="hidden" name="data" value="{{ liqpay_data }}">
        <input type="hidden" name="signature" value="{{ liqpay_signature }}">
        <button class="btn" type="submit">Оплатити через LiqPay</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/liqpay-auto-submit.js' %}?v=20260820a" defer></script>
{% endblock %}
