# Overlay after certbot. Requires DOMAIN replaced in deploy/nginx/docker.prod.conf.
services:
  nginx:
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./deploy/nginx/docker.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
